<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; base-uri 'none'; style-src 'sha256-@OBELISK_COVERAGE_CSS_HASH@'; script-src 'sha256-@OBELISK_COVERAGE_DATA_HASH@' 'sha256-@OBELISK_COVERAGE_JAVASCRIPT_HASH@'">
  <title>Obelisk coverage</title>
  <style>@OBELISK_COVERAGE_CSS@</style>
</head>
<body>
<header id="top">

<nav id="side" aria-label="Report navigation"></nav>
<main id="main"></main>
<script id="coverage-data" type="application/json">@OBELISK_COVERAGE_DATA@</script>
<script>@OBELISK_COVERAGE_JAVASCRIPT@</script>
</body>
</html>
