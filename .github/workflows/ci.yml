name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Step 1: build the repository and run the lit regression suite.
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4

      # No disk reclamation step: the runner starts with ~87 GB free on a
      # 145 GB volume, and a full build -- 12 GB of extracted LLVM, the 1.9 GB
      # archive and ~6 GB of build tree -- peaks around 22 GB.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake ccache
          # The runner's system Python is externally managed (PEP 668), so a
          # plain --user install is refused; this is a throwaway VM, so opting
          # out of the marker is the whole fix.
          python3 -m pip install --user --break-system-packages lit
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # test/lit.cfg.py treats a missing split-file as fatal, which aborts the
      # entire suite rather than skipping the tests that use it. The pinned
      # LLVM release archive ships neither split-file nor FileCheck (hence
      # tools/filecheck), and the runner image is not guaranteed to carry
      # llvm-N-tools, so install it explicitly.
      - name: Install LLVM test tools
        run: |
          package=$(apt-cache --names-only search '^llvm-[0-9]+-tools$' \
                    | cut -d' ' -f1 | sort -V | tail -1)
          test -n "$package"
          sudo apt-get install -y --no-install-recommends "$package"
          # lit.cfg.py falls back to a fixed list of versioned names, so
          # publish the unversioned one; a newer package can then never fall
          # off the end of that list.
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(ls -1 /usr/bin/split-file-* | sort -V | tail -1)" \
                 "$HOME/.local/bin/split-file"
          "$HOME/.local/bin/split-file" --version

      # Nothing downloaded is cached. Every pinned archive is content-addressed
      # and fetched over the network either way, so a cache restore would move
      # the same bytes from a different host; the shared 10 GB budget is worth
      # more to ccache, which stores something the runner cannot re-fetch.
      #
      # Cache entries are immutable, so a compiler cache has to be written under
      # a fresh key each run and recovered through the prefix fallback --
      # a fixed key would freeze at the first green build and decay from there.
      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-native-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-native-${{ runner.os }}-

      - name: Prepare compiler cache
        run: |
          ccache --max-size=2G
          ccache --zero-stats

      # ccache is opted into here rather than in CMakeLists.txt, so local
      # builds are untouched. The launcher reaches Z3's nested configure
      # through the pass-through in CMakeLists.txt.
      #
      # The real-UVM regression is opt-in because it fetches the Accellera
      # release, but it is only two frontend tests over a ~10 MB archive and it
      # is the one thing guarding elaboration of unmodified UVM, so CI pays it.
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOBELISK_INCLUDE_TESTS=ON \
            -DOBELISK_ENABLE_REAL_UVM_TESTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Compiler cache stats
        if: always()
        run: ccache --show-stats --verbose

      # Saved only from the default branch: cache entries are branch-scoped, so
      # pull-request entries can never be read by main yet still consume the
      # shared 10 GB budget and evict the entries everything else relies on.
      # Pull requests still restore from main above.
      - name: Save compiler cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-native-${{ runner.os }}-${{ github.sha }}

      - name: Run lit regression suite
        run: cmake --build build --target check-obelisk

  # ---------------------------------------------------------------------------
  # Build and smoke-test the wasm toolchain on every ref. Main additionally
  # uploads the tested page for the deploy job below, so pull requests cannot
  # merge wasm-only regressions.
  #
  # Deliberately not gated on the native job. The two share no build output, so
  # sequencing them only delayed the page by a full native build -- and while
  # the native suite was red the wasm job never ran, so its compiler cache
  # could never be repopulated and every eventual run started cold.
  # ---------------------------------------------------------------------------
  wasm-build-and-test:
    name: Build and test wasm
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # Build the checked-in SDK image instead of relying on a separately
    # published GHCR package. BuildKit's cache makes the expensive LLVM layer
    # reusable while a clean fork or fresh repository remains self-contained.
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      WASM_IMAGE: obelisk-llvm-wasm32:ci
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build wasm32 SDK image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile.llvm-wasm
          target: toolchain
          load: true
          tags: ${{ env.WASM_IMAGE }}
          build-args: JOBS=4
          cache-from: type=gha,scope=obelisk-llvm-wasm32
          cache-to: type=gha,mode=min,scope=obelisk-llvm-wasm32

      # A separate key from the native job: different compiler, different
      # target, so the two would only evict each other under one key.
      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-wasm-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-wasm-${{ runner.os }}-

      - name: Prepare compiler cache
        run: |
          mkdir -p "$CCACHE_DIR"
          docker run --rm -v "$CCACHE_DIR:/ccache" \
            -e CCACHE_DIR=/ccache "$WASM_IMAGE" \
            sh -c 'ccache --max-size=2G && ccache --zero-stats'

      # The SDK ships inside the image. CMakeLists.txt always downloads and
      # extracts OBELISK_LLVM_PREBUILT_URL, so it is consumed through a file://
      # URL rather than needing a source change.
      - name: Build obelisk for wasm32
        run: |
          docker run --rm -v "$PWD:/src" -v "$CCACHE_DIR:/ccache" \
            -w /src -e CCACHE_DIR=/ccache "$WASM_IMAGE" bash -c '
              set -euo pipefail
              SHA=$(cat "$OBELISK_LLVM_WASM_SHA256_FILE")
              emcmake cmake -S . -B build-wasm -G Ninja \
                -DCMAKE_BUILD_TYPE=MinSizeRel \
                -DOBELISK_INCLUDE_TESTS=OFF \
                -DOBELISK_LLVM_PREBUILT_URL="file://$OBELISK_LLVM_WASM_SDK" \
                -DOBELISK_LLVM_PREBUILT_SHA256="$SHA" \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
              cmake --build build-wasm -j "$(nproc)" --target obelisk
            '

      - name: Compiler cache stats
        if: always()
        run: |
          docker run --rm -v "$CCACHE_DIR:/ccache" \
            -e CCACHE_DIR=/ccache "$WASM_IMAGE" ccache --show-stats --verbose

      - name: Save compiler cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-wasm-${{ runner.os }}-${{ github.sha }}

      - name: Assemble site
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$WASM_IMAGE" bash -c '
            set -euo pipefail
            mkdir -p site/toolchain
            cp -r web/* site/
            cp build-wasm/tools/driver/obelisk.wasm site/
            cp build-wasm/tools/driver/obelisk.js site/
            cp build-wasm/target-runtime/libobelisk_rt.a site/toolchain/
            # Populate Emscripten cache entries for the no-exception ABI, then
            # publish exactly those libc++ variants for simulation links.
            em++ /emsdk/upstream/emscripten/test/hello_world.cpp -O3 \
              -fno-exceptions -o /tmp/hello.js
            LIB=/emsdk/upstream/emscripten/cache/sysroot/lib/wasm32-emscripten
            cp "$LIB/libstubs.a" site/toolchain/libstubs.a
            cp "$LIB/libnoexit.a" site/toolchain/libnoexit.a
            cp "$LIB/libc.a" site/toolchain/libc.a
            cp "$LIB/libdlmalloc.a" site/toolchain/libdlmalloc.a
            cp "$LIB/libclang_rt.builtins.a" site/toolchain/libcompiler_rt.a
            cp "$LIB/libc++-noexcept.a" site/toolchain/libc++.a
            cp "$LIB/libc++abi-noexcept.a" site/toolchain/libc++abi.a
            cp "$LIB/libunwind-noexcept.a" site/toolchain/libunwind.a
            du -sh site
            test "$(du -sm site | cut -f1)" -lt 1000
          '

      - name: Reject wasm exception opcodes
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$WASM_IMAGE" bash -c '
            set -euo pipefail
            OBJDUMP=/emsdk/upstream/bin/llvm-objdump
            test -x "$OBJDUMP"
            PATTERN="^[[:space:]]+[0-9a-f]+: .*\\b(try|try_table|catch|catch_all|delegate|rethrow|throw|throw_ref)\\b"
            EH_SYMBOLS="(__cxa_(allocate_exception|begin_catch|end_catch|rethrow|throw)|_Unwind_)"
            DUMP=$(mktemp)
            trap "rm -f \"$DUMP\"" EXIT
            for input in site/obelisk.wasm site/toolchain/*.a; do
              if ! "$OBJDUMP" -d "$input" >"$DUMP" 2>&1; then
                echo "failed to disassemble $input" >&2
                cat "$DUMP" >&2
                exit 1
              fi
              if grep -Eq "$PATTERN" "$DUMP"; then
                echo "wasm exception opcode found in $input" >&2
                exit 1
              fi
              if [[ "$input" == *.a ]]; then
                "$OBJDUMP" --syms "$input" >"$DUMP"
                if grep -E "[[:space:]]\\*UND\\*[[:space:]].*$EH_SYMBOLS" \
                    "$DUMP"; then
                  echo "C++ exception runtime dependency in $input" >&2
                  exit 1
                fi
              fi
            done
          '

      - name: Run browser unit tests
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$WASM_IMAGE" bash -c '
            set -euo pipefail
            for test in web/*.test.mjs; do node "$test"; done
          '

      - name: Run browser-toolchain smoke test
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$WASM_IMAGE" \
            node site/smoke-test.mjs

      # Every design the page offers, at both optimization levels. The smoke
      # test proves one small design works; these cover classes, randomization,
      # assertions, tri-state nets and an RV32IM core, which is a far wider
      # slice of the language and of the runtime ABI.
      - name: Run every example design
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$WASM_IMAGE" \
            node site/examples-test.mjs -O3
          docker run --rm -v "$PWD:/src" -w /src "$WASM_IMAGE" \
            node site/examples-test.mjs -O0

      - name: Remove test runners from Pages artifact
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$WASM_IMAGE" \
            sh -c 'rm -f site/*.test.mjs site/smoke-test.mjs \
              site/examples-test.mjs'

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  # The wasm job owns the artifact so the exact files that passed its
  # browser-toolchain smoke test are the ones deployed. This job performs no
  # rebuild and never writes to a branch.
  #
  # Depends on both builds even though only one produces the artifact: the two
  # now run concurrently, and a page must never ship from a commit whose native
  # regression suite is failing.
  deploy-pages:
    name: Deploy Pages
    needs: [build-and-test, wasm-build-and-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
