<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talos: SystemVerilog simulator in the browser</title>
<meta name="description" content="Write, compile, and simulate SystemVerilog in the browser. Inspect every stage of the compiler pipeline.">
<link rel="icon" type="image/svg+xml" href="./talos.svg">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans@5.0.20/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5.0.13/index.css">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<header class="masthead">
  <div class="identity">
    <img class="glyph" src="./talos.svg" width="24" height="24" alt="" aria-hidden="true">
    <h1>talos</h1>
  </div>

  <div class="actions">
    <button id="flagsToggle" class="ghost" aria-expanded="false" aria-controls="flagsPanel">
      Options
      <svg class="chev" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4"/></svg>
    </button>
    <button id="share" class="ghost" title="Copy a link that restores this source and these options">Copy link</button>
    <button id="embed" class="ghost" title="Get a snippet that makes this design runnable on another website">Embed</button>
    <button id="run" class="run" disabled>
      <span id="runLabel">Loading</span>
      <kbd>⌘⏎</kbd>
    </button>
    <a class="ghost githubLink" href="https://github.com/Kuree/talos" target="_blank" rel="noopener noreferrer" aria-label="Talos on GitHub" title="View source on GitHub">
      <!-- GitHub mark from Simple Icons, CC0: https://simpleicons.org/ -->
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
        <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
      </svg>
    </a>
  </div>
</header>

<section id="flagsPanel" class="options" hidden>
  <div class="grid">
    <label class="field">
      <span>Language</span>
      <select id="std">
        <option value="1800-2023" selected>IEEE 1800-2023</option>
        <option value="1800-2017">IEEE 1800-2017</option>
      </select>
    </label>

    <label class="field">
      <span>Optimization</span>
      <select id="opt">
        <option>-O0</option><option>-O1</option><option>-O2</option>
        <option selected>-O3</option>
      </select>
    </label>

    <label class="field">
      <span>Execution tier</span>
      <select id="tier">
        <option value="native" selected>native</option>
        <option value="bytecode">bytecode</option>
      </select>
    </label>

    <label class="field">
      <span>Scheduler</span>
      <select id="scheduler">
        <option value="auto" selected>auto</option>
        <option value="generic">generic</option>
        <option value="aot">aot</option>
        <option value="eval">eval</option>
      </select>
    </label>

    <label class="field">
      <span>Static specialization</span>
      <select id="specialization">
        <option value="auto" selected>auto</option>
        <option value="on">on</option>
        <option value="off">off</option>
      </select>
    </label>

    <label class="field">
      <span>Coverage</span>
      <select id="coverage">
        <option value="off" selected>off</option>
        <option value="on">line, toggle, functional</option>
      </select>
    </label>

    <label class="field">
      <span>Top module</span>
      <input id="top" type="text" placeholder="inferred" spellcheck="false">
    </label>

    <label class="field">
      <span>Timescale</span>
      <input id="timescale" type="text" placeholder="1ns/1ps" spellcheck="false">
    </label>

    <label class="field">
      <span>Macros</span>
      <input id="defines" type="text" placeholder="WIDTH=8 DEBUG" spellcheck="false">
    </label>

    <label class="field wide">
      <span>Additional flags</span>
      <input id="extra" type="text" spellcheck="false"
             placeholder="--error-limit=10 --ignore-unknown-modules -Xslang …">
    </label>
  </div>

  <!-- Show the command being run. The options above are a shortcut for it,
       not a replacement, so the flags stay learnable. -->
  <div class="commandline">
    <span class="prompt">$</span>
    <code id="command"></code>
    <button id="copyCommand" class="ghost tiny">Copy</button>
  </div>
</section>

<main class="workbench">
  <section class="panel" id="sourcePanel">
    <div class="panelHead">
      <h2>design.sv</h2>
      <select id="examples" class="inline" title="Load an example">
        <option value="">Custom design</option>
      </select>
    </div>
    <div id="editor"></div>
  </section>

  <div class="handle" id="handle" role="separator" aria-orientation="vertical"
       tabindex="0" aria-label="Resize panels"></div>

  <!-- The inspector's tabs are the compiler's real pipeline. Run is the
       terminus and the default; the IR stages are there when you want to look
       inside, and each compiles on demand. -->
  <section class="panel" id="inspector">
    <nav class="pipeline" aria-label="Pipeline stage">
      <ol id="stages" role="tablist"></ol>
    </nav>
    <div class="panelHead">
      <h2 id="stageBlurb"></h2>
      <div class="panelTools">
        <span id="status" class="status"></span>
        <button id="scheduleToggle" class="ghost tiny" hidden>View IR</button>
        <button id="downloadWaveform" class="ghost tiny" hidden>Download VCD</button>
        <button id="downloadCoverage" class="ghost tiny" hidden>Download report</button>
        <button id="copyOutput" class="ghost tiny">Copy</button>
      </div>
    </div>
    <pre id="output" class="console" aria-live="polite" tabindex="0"></pre>
    <div id="irEditor" class="irEditor" aria-label="Read-only compiler output" hidden></div>
    <div id="scheduleView" class="scheduleView" aria-label="Compute schedule graph" hidden></div>
    <div id="waveformView" class="waveform" hidden>
      <div id="waveformEmpty" class="waveformEmpty"></div>
      <iframe id="surfer" title="Surfer waveform viewer"
              sandbox="allow-scripts" referrerpolicy="no-referrer" hidden></iframe>
    </div>
    <!-- The page talos-cov writes for the latest run, in an opaque-origin
         sandbox: it runs its own scripts but cannot reach this page. -->
    <div id="coverageView" class="waveform" hidden>
      <div id="coverageEmpty" class="waveformEmpty"></div>
      <iframe id="coverageFrame" title="Coverage report"
              sandbox="allow-scripts" referrerpolicy="no-referrer" hidden></iframe>
    </div>
  </section>
</main>

<!-- Embed snippets for runner.js, which makes code blocks on any website
     runnable against this deployment. -->
<dialog id="embedDialog" class="embedDialog" aria-labelledby="embedTitle">
  <form method="dialog" class="embedHead">
    <h2 id="embedTitle">Embed this design</h2>
    <button class="ghost tiny" aria-label="Close">Close</button>
  </form>
  <div class="embedFormats" role="tablist" aria-label="Snippet format">
    <button id="embedHtml" role="tab" aria-selected="true">HTML</button>
    <button id="embedMarkdown" role="tab" aria-selected="false">Markdown</button>
  </div>
  <pre class="embedSnippet" tabindex="0"><code id="embedCode"></code></pre>
  <p id="embedNote" class="embedNote"></p>
  <div class="embedFoot">
    <div id="embedColors" class="segmented" role="radiogroup" aria-label="Colors">
      <span class="segmentedLabel" aria-hidden="true">Colors</span>
      <button role="radio" data-colors="light" aria-checked="true">Light</button>
      <button role="radio" data-colors="dark" aria-checked="false">Dark</button>
      <button role="radio" data-colors="plain" aria-checked="false">Plain</button>
    </div>
    <button id="copyEmbed" class="run">Copy snippet</button>
  </div>
</dialog>

<script type="module" src="./app.js"></script>
</body>
</html>
