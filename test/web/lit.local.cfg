# -*- Python -*-

# The web playground's JavaScript tests are lit tests themselves: each
# *.test.mjs carries its own RUN line.
config.suffixes.add(".mjs")

# These run against an assembled site that contains the wasm compiler, which
# only the wasm CI job builds. They are invoked there directly.
config.excludes.update(["smoke-test.mjs", "examples-test.mjs"])
